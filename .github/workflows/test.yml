name: test

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: run pre-commit
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        preset: [debug, asan, ubsan, release]

    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang-20' || 'gcc-15' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++-20' || 'g++-15' }}
      CXXFLAGS: ${{ matrix.compiler == 'clang' && '-stdlib=libc++' || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: install deps
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y ninja-build gdb gcc-15 g++-15

      - name: install LLVM 20 with libc++
        if: matrix.compiler == 'clang'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev

      - name: configure
        run: cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --verbose

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: configure
        run: cmake --preset windows-debug

      - name: build
        run: cmake --build --preset windows-debug

      - name: test
        run: ctest --preset windows-debug --output-on-failure --verbose

  install:
    runs-on: ubuntu-latest

    env:
      CC: gcc-15
      CXX: g++-15

    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-15 g++-15

      - name: configure
        run: cmake --preset release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_install

      - name: build and install
        run: cmake --build --preset release --target install

      - name: build a find_package consumer
        run: |
          cmake -S test/install -B _build/install-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/_install
          cmake --build _build/install-consumer
          ./_build/install-consumer/consumer
